<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My AI Assistant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Arial, sans-serif;
            background: #0f172a;
            color: #e5e7eb;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */

        .header {
            height: 65px;
            background: #111827;
            border-bottom: 1px solid #263244;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
        }

        .clear-button {
            background: transparent;
            color: #9ca3af;
            border: 1px solid #374151;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
        }

        .clear-button:hover {
            background: #1f2937;
            color: white;
        }

        /* Chat area */

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 30px 20px;
        }

        .chat {
            max-width: 850px;
            margin: auto;
        }

        .message {
            display: flex;
            margin-bottom: 22px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 75%;
            padding: 13px 17px;
            border-radius: 16px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .assistant .bubble {
            background: #1e293b;
            border-bottom-left-radius: 5px;
        }

        .user .bubble {
            background: #2563eb;
            color: white;
            border-bottom-right-radius: 5px;
        }

        /* Welcome */

        .welcome {
            text-align: center;
            margin-top: 100px;
            color: #94a3b8;
        }

        .welcome h1 {
            color: white;
            font-size: 32px;
            margin-bottom: 10px;
        }

        /* Input */

        .input-area {
            padding: 18px 20px 24px;
            background: #0f172a;
        }

        .input-box {
            max-width: 850px;
            margin: auto;
            display: flex;
            gap: 10px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 10px;
        }

        textarea {
            flex: 1;
            resize: none;
            border: none;
            outline: none;
            background: transparent;
            color: white;
            font-size: 16px;
            min-height: 45px;
            max-height: 150px;
            padding: 10px;
        }

        textarea::placeholder {
            color: #64748b;
        }

        .send-button {
            width: 50px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .send-button:hover {
            background: #1d4ed8;
        }

        .send-button:disabled {
            background: #475569;
            cursor: not-allowed;
        }

        /* Thinking animation */

        .thinking {
            display: flex;
            gap: 5px;
            padding: 5px;
        }

        .dot {
            width: 7px;
            height: 7px;
            background: #94a3b8;
            border-radius: 50%;
            animation: blink 1.4s infinite both;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {
            0%, 80%, 100% {
                opacity: 0.3;
            }

            40% {
                opacity: 1;
            }
        }

        /* Mobile */

        @media (max-width: 600px) {

            .header {
                padding: 0 15px;
            }

            .chat-container {
                padding: 20px 12px;
            }

            .bubble {
                max-width: 88%;
            }

            .welcome {
                margin-top: 60px;
            }

            .welcome h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <header class="header">

        <div class="logo">
            🤖 My AI Assistant
        </div>

        <button class="clear-button" onclick="clearChat()">
            Clear Chat
        </button>

    </header>


    <main class="chat-container">

        <div class="chat" id="chat">

            <div class="welcome" id="welcome">

                <h1>How can I help you?</h1>

                <p>
                    Ask me anything and I'll try my best to answer.
                </p>

            </div>

        </div>

    </main>


    <div class="input-area">

        <div class="input-box">

            <textarea
                id="prompt"
                placeholder="Message your AI..."
                rows="1"
            ></textarea>

            <button
                class="send-button"
                id="sendButton"
                onclick="sendMessage()"
            >
                ↑
            </button>

        </div>

    </div>


    <script>

        const promptBox = document.getElementById("prompt");
        const chat = document.getElementById("chat");
        const sendButton = document.getElementById("sendButton");
        const welcome = document.getElementById("welcome");


        /* Send when Enter is pressed */

        promptBox.addEventListener("keydown", function(event) {

            if (event.key === "Enter" && !event.shiftKey) {

                event.preventDefault();

                sendMessage();
            }

        });


        /* Automatically grow textarea */

        promptBox.addEventListener("input", function() {

            this.style.height = "auto";

            this.style.height = this.scrollHeight + "px";

        });


        /* Add message */

        function addMessage(text, sender) {

            if (welcome) {
                welcome.style.display = "none";
            }

            const message = document.createElement("div");

            message.className = "message " + sender;

            const bubble = document.createElement("div");

            bubble.className = "bubble";

            bubble.textContent = text;

            message.appendChild(bubble);

            chat.appendChild(message);

            scrollToBottom();

            return message;
        }


        /* Thinking indicator */

        function addThinking() {

            const message = document.createElement("div");

            message.className = "message assistant";

            message.id = "thinking";

            message.innerHTML = `
                <div class="bubble">
                    <div class="thinking">
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                </div>
            `;

            chat.appendChild(message);

            scrollToBottom();

        }


        /* Remove thinking indicator */

        function removeThinking() {

            const thinking = document.getElementById("thinking");

            if (thinking) {
                thinking.remove();
            }

        }


        /* Scroll */

        function scrollToBottom() {

            const container =
                document.querySelector(".chat-container");

            container.scrollTop = container.scrollHeight;

        }


        /* Send message */

        async function sendMessage() {

            const prompt = promptBox.value.trim();

            if (!prompt) {
                return;
            }

            addMessage(prompt, "user");

            promptBox.value = "";

            promptBox.style.height = "auto";

            sendButton.disabled = true;

            addThinking();


            try {

                const response = await fetch("/api/chat", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        prompt: prompt
                    })

                });


                const data = await response.json();

                removeThinking();


                if (!response.ok) {

                    addMessage(
                        data.error || "Something went wrong.",
                        "assistant"
                    );

                    return;
                }


                addMessage(
                    data.response,
                    "assistant"
                );


            } catch (error) {

                removeThinking();

                addMessage(
                    "Unable to connect to the AI server.",
                    "assistant"
                );

            } finally {

                sendButton.disabled = false;

                promptBox.focus();

            }

        }


        /* Clear chat */

        function clearChat() {

            chat.innerHTML = `
                <div class="welcome" id="welcome">

                    <h1>How can I help you?</h1>

                    <p>
                        Ask me anything and I'll try my best to answer.
                    </p>

                </div>
            `;

            promptBox.focus();

        }

    </script>

</body>
</html>
